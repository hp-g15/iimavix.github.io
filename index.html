<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة ابو عبدالعزيز الرمضانية 🌙</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        /* ================= CSS - الفخامة الرمضانية ================= */
        :root {
            --primary: #1A4D4E; /* ذهبي رمضاني */
            --secondary: #0a192f; /* كحلي ليلي */
            --glass-bg: rgba(10, 25, 47, 0.7);
            --glass-border: #18393a;
        }
        
        * { box-sizing: border-box; font-family: 'Cairo', sans-serif; margin: 0; padding: 0; }
        
        body {
            background: url('bg.jpg') no-repeat center center fixed;
            background-size: cover;
            background-color: var(--secondary);
            color: #fff; min-height: 100vh; overflow-x: hidden;
            position: relative;
        }

        .overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle at center, rgba(10,25,47,0.4) 0%, rgba(0,0,0,0.8) 100%);
            z-index: -1;
        }

        .top-bar {
            display: flex; justify-content: space-between; align-items: center;
            padding: 15px 30px; background: rgba(0,0,0,0.5);
            border-bottom: 2px solid var(--primary);
        }

        .logo { max-height: 60px; }

        .audio-player { display: flex; align-items: center; gap: 10px; background: var(--glass-bg); padding: 10px 20px; border-radius: 30px; border: 1px solid var(--glass-border); }
        .audio-player input[type="range"] { accent-color: var(--primary); width: 100px; }

        .screen { display: none; min-height: calc(100vh - 150px); padding: 40px; animation: fadeIn 0.8s ease; }
        .screen.active { display: flex; flex-direction: column; align-items: center; }
        
        h1, h2 { color: var(--primary); text-shadow: 0 0 15px #276161 ; text-align: center; margin-bottom: 30px; }
        h1 { font-size: 3.5rem; }
        
        button, input {
            background: rgba(255, 255, 255, 0.05); border: 1px solid var(--glass-border);
            color: #fff; padding: 15px 30px; font-size: 1.2rem; border-radius: 15px;
            backdrop-filter: blur(10px); cursor: pointer; transition: all 0.3s ease;
            outline: none; margin: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }
        button:hover { background: var(--primary); color: #000; box-shadow: 0 0 25px var(--primary); transform: translateY(-3px); }
        input:focus { border-color: var(--primary); box-shadow: 0 0 15px var(--primary); background: rgba(0,0,0,0.6); }
        
        .glass-card {
            background: var(--glass-bg); border: 1px solid var(--glass-border);
            border-radius: 20px; padding: 40px; backdrop-filter: blur(15px);
            width: 100%; max-width: 800px; text-align: center; margin-bottom: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .scoreboard { display: flex; justify-content: center; gap: 20px; width: 100%; margin-bottom: 30px; font-size: 1.5rem; font-weight: bold; }
        .team-score { padding: 15px 40px; background: rgba(0,0,0,0.7); border-radius: 15px; border-bottom: 3px solid var(--primary); transition: 0.3s; }
        .active-turn { box-shadow: 0 0 25px var(--primary); transform: scale(1.1); color: var(--primary); }

        .letters-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 15px; width: 100%; max-width: 800px; }
        .letter-btn { padding: 15px; font-size: 1.8rem; font-weight: 900; border-radius: 50%; width: 70px; height: 70px; display: flex; align-items: center; justify-content: center; }
        .letter-btn.used { opacity: 0.2; pointer-events: none; filter: grayscale(100%); }

        .hint-btn { background: #17a2b8; border-color: #17a2b8; font-size: 1rem; padding: 10px 20px; }
        .hint-btn:hover { background: #138496; color: white; box-shadow: 0 0 15px #17a2b8; }

        .competition-board { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; width: 100%; }
        .answer-slot {
            background: linear-gradient(135deg, #111, #222); border: 1px solid var(--primary);
            padding: 20px; border-radius: 15px; font-size: 1.3rem; text-align: center;
            color: transparent; position: relative; transition: 0.5s;
        }
        .answer-slot.revealed {
            background: linear-gradient(135deg, var(--primary), #0f2c2c); color: #000;
            text-shadow: none; font-weight: 900; transform: rotateX(360deg);
        }
        .answer-slot::before { content: attr(data-index); position: absolute; left: 15px; top: 15px; color: rgba(255,255,255,0.3); font-size: 1.5rem; }

        .timer { font-size: 3.5rem; color: #ff4757; text-shadow: 0 0 20px #ff4757; margin: 20px 0; font-weight: 900; }

        footer { text-align: center; padding: 20px; color: rgba(255,255,255,0.5); position: absolute; bottom: 0; width: 100%; }

        /* ستايل الفئات */
        .category-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-top: 20px; }
        .cat-btn { background: linear-gradient(45deg, #0f2c2c, #1A4D4E); font-size: 1.5rem; font-weight: bold; }
        .loading-text { color: #f1c40f; font-size: 1.5rem; margin: 20px 0; display: none; animation: pulse 1s infinite alternate; }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes pulse { from { opacity: 0.5; } to { opacity: 1; } }
    </style>
</head>
<body>
    <div class="overlay"></div>

    <div class="top-bar">
        <img src="logo" alt="Logo" class="logo" onerror="this.style.display='none'">
        <div class="audio-player">
            <span>🎵 :</span>
            <button onclick="toggleAudio()" id="audio-btn" style="padding: 5px 15px; margin:0;">▶️ تشغيل</button>
            <input type="range" id="volume-slider" min="0" max="1" step="0.1" value="0.5" onchange="changeVolume()">
        </div>
    </div>
    
    <audio id="bg-audio" src="ramadn.mp3" loop></audio>

    <div id="main-menu" class="screen active">
        <h1> ليالي ابو عبد العزيز الرمضانية                    🌙</h1>
        <div class="glass-card">
            <button onclick="goToSetup('letters')"> تحدي الحروف </button>
            <button onclick="goToSetup('pictures')"> تحدي الصور </button>
            <button onclick="goToSetup('competition')"> س / ج (بالذكاء الاصطناعي) </button>
        </div>
    </div>

    <div id="setup-screen" class="screen">
        <h2>أدخل أسماء المتنافسين</h2>
        <div class="glass-card" id="teams-container">
            <input type="text" id="team1-name" placeholder="اللاعب/الفريق الأول" value="الفريق الأول">
            <input type="text" id="team2-name" placeholder="اللاعب/الفريق الثاني" value="الفريق الثاني">
        </div>
        <button onclick="startGame()"> بدء </button>
        <button onclick="showScreen('main-menu')">عودة</button>
    </div>

    <div id="game-letters" class="screen">
        <div class="scoreboard">
            <div id="l-team1" class="team-score active-turn">فريق 1: 0</div>
            <div id="l-team2" class="team-score">فريق 2: 0</div>
        </div>
        <div class="letters-grid" id="letters-grid"></div>
        <div id="letter-modal" class="glass-card" style="display:none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); z-index: 10;">
            <h2 id="letter-question">السؤال هنا</h2>
            <div class="timer" id="letter-timer">15</div>
            <input type="text" id="letter-answer" placeholder="اكتب الإجابة هنا بدقة...">
            <br>
            <button class="hint-btn" onclick="showHint('letter')">تلميح 💡</button>
            <button onclick="checkLetterAnswer()">تأكيد الإجابة</button>
            <button onclick="showLetterAnswer()">كشف الإجابة</button>
            <p id="letter-correct-answer" style="display:none; color:var(--primary); margin-top:15px; font-size:2rem; font-weight:bold;"></p>
            <button onclick="closeLetterModal()" style="background:#ff4757; margin-top:20px;">تخطي / إغلاق</button>
        </div>
    </div>

    <div id="game-pictures" class="screen">
        <h2>  15 نقطة </h2>
        <div class="scoreboard" id="p-scoreboard"></div>
        <div class="glass-card">
            <h1 id="pic-puzzle" style="font-size: 4rem; margin: 30px 0;">لغز الصورة</h1>
            <input type="text" id="pic-guess" placeholder="اكتب إجابتك هنا...">
            <br>
            <button class="hint-btn" onclick="showHint('pic')">تلميح 💡</button>
            <button onclick="checkPicAnswer()">تحقق من الإجابة</button>
            <h2 id="pic-answer" style="display: none; color:var(--primary); font-size:3rem; margin-top: 20px;">الإجابة</h2>
            <button onclick="document.getElementById('pic-answer').style.display='block';">كشف الإجابة فقط</button>
            <hr style="border-color:var(--glass-border); margin:20px 0;">
            <h3>منح النقطة يدوياً لـ:</h3>
            <div id="pic-award-btns"></div>
            <button onclick="nextPicture()" style="margin-top:20px; background:#4CAF50;">اللغز التالي ⏭️</button>
        </div>
    </div>

    <div id="game-competition" class="screen">
        <div class="scoreboard" id="c-scoreboard"></div>
        
        <div id="category-selection" class="glass-card">
            <h2>اختر فئة السؤال 🎯</h2>
            <div class="category-grid">
                <button class="cat-btn" onclick="startAIQuestion('إسلاميات')">🕌 إسلاميات</button>
                <button class="cat-btn" onclick="startAIQuestion('تاريخ')">📜 تاريخ</button>
                <button class="cat-btn" onclick="startAIQuestion('ثقافة عامة')">🌍 ثقافة عامة</button>
                <button class="cat-btn" onclick="startAIQuestion('رياضة')">⚽ رياضة</button>
                <button class="cat-btn" onclick="startAIQuestion('علوم وطبيعة')">🔬 علوم وطبيعة</button>
                <button class="cat-btn" onclick="startAIQuestion('جغرافيا وعواصم')">🗺️ جغرافيا</button>
            </div>
        </div>

        <div id="loading-indicator" class="loading-text">🤖 الذكاء الاصطناعي يكتب السؤال... يرجى الانتظار</div>

        <div id="play-area" style="display:none; width: 100%; max-width: 800px;">
            <h2 id="comp-question" style="font-size: 2rem;">السؤال هنا</h2>
            <div class="glass-card">
                <input type="text" id="comp-guess" placeholder="اكتب الإجابة..." onkeypress="if(event.key === 'Enter') checkCompAnswer()">
                <button onclick="checkCompAnswer()">إرسال</button>
                <button class="hint-btn" onclick="showHint('comp')">تلميح للمتبقي 💡</button>
                <div class="competition-board" id="comp-board" style="margin-top: 30px;"></div>
                
                <button onclick="backToCategories()" id="comp-next-btn" style="display:none; margin-top:20px; background:#4CAF50; width:100%;">العودة لاختيار فئة جديدة ⏭️</button>
            </div>
        </div>
    </div>

    <div id="results-screen" class="screen">
        <h1 style="font-size: 5rem;">🏆 بطل ليلة رمضان 🏆</h1>
        <div class="glass-card" id="final-results-container"></div>
        <button onclick="showScreen('main-menu')">لعبة جديدة</button>
    </div>

    <footer> © Abo Abdualziz</footer>

    <script>
        // --- إعدادات الذكاء الاصطناعي (هام جداً) ---
        // ضع مفتاح الـ API الخاص بـ Gemini هنا لكي تعمل الأسئلة التلقائية
        const API_KEY = "AIzaSyDTWxKPemWHerwuN32Uap_3QnjXwbCJXl8"; 

        // --- الصوتيات ---
        const bgAudio = document.getElementById('bg-audio');
        function toggleAudio() {
            if(bgAudio.paused) { bgAudio.play(); document.getElementById('audio-btn').innerText = "⏸️"; }
            else { bgAudio.pause(); document.getElementById('audio-btn').innerText = "▶️"; }
        }
        function changeVolume() { bgAudio.volume = document.getElementById('volume-slider').value; }

        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playSound(type) {
            if(audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain();
            osc.connect(gain); gain.connect(audioCtx.destination);
            if(type === 'correct') { osc.type = 'triangle'; osc.frequency.setValueAtTime(400, audioCtx.currentTime); osc.frequency.exponentialRampToValueAtTime(800, audioCtx.currentTime + 0.3); gain.gain.setValueAtTime(0.3, audioCtx.currentTime); gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.5); osc.start(); osc.stop(audioCtx.currentTime + 0.5); }
            else if(type === 'wrong') { osc.type = 'sawtooth'; osc.frequency.setValueAtTime(300, audioCtx.currentTime); osc.frequency.exponentialRampToValueAtTime(100, audioCtx.currentTime + 0.4); gain.gain.setValueAtTime(0.3, audioCtx.currentTime); gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.4); osc.start(); osc.stop(audioCtx.currentTime + 0.4); }
        }

        let currentGame = ''; let teams = []; let scores = []; let currentTurn = 0; let timerInterval;
        let currentDataObj = null;

        // --- البيانات الصعبة والمتقدمة (للحروف والصور كما هي) ---
        const lettersQuestions = {
            'أ': [ { q: 'أول جبل وضع في الأرض؟', a: 'ابو قبيس', hint: 'موجود في مكة المكرمة' } ],
            'ب': [ { q: 'مدينة تلقب بمدينة التلال السبع؟', a: 'روما', hint: 'عاصمة دولة أوروبية عريقة' } ],
            'ت': [{ q: 'حيوان زاحف ضخم يسمى بـ "دموع الـ..."؟', a: 'تمساح', hint: 'يعيش في النيل' }]
        };

        const picturesData = [
            { puzzle: '👁️ + 🪡', answer: 'ابرة', hint: 'شيء يستخدم في الخياطة' }
        ];

        // --- دوال اللعبة الأساسية ---
        function cleanText(text) { return text.replace(/[أإآ]/g, 'ا').replace(/ة/g, 'ه').trim().toLowerCase(); }

        function showScreen(id) { document.querySelectorAll('.screen').forEach(s => s.classList.remove('active')); document.getElementById(id).classList.add('active'); }
        function goToSetup(game) { currentGame = game; showScreen('setup-screen'); }
        function startGame() {
            teams = Array.from(document.querySelectorAll('#teams-container input')).map(i => i.value);
            scores = new Array(teams.length).fill(0); currentTurn = 0;
            if(currentGame === 'letters') initLettersGame();
            else if(currentGame === 'pictures') initPicturesGame();
            else if(currentGame === 'competition') initCompetitionGame();
        }

        function showHint(type) {
            if(!currentDataObj || !currentDataObj.hint) { alert('لا يوجد تلميح إضافي!'); return; }
            alert('💡 التلميح: ' + currentDataObj.hint);
        }

        // ================= 1 & 2. الحروف والصور (نفس الكود الخاص بك) =================
        function initLettersGame() { /* اختصاراً للمساحة: الكود الخاص بك يعمل هنا بشكل ممتاز */ }
        function initPicturesGame() { /* اختصاراً للمساحة: الكود الخاص بك يعمل هنا بشكل ممتاز */ }

        // ================= 3. المنافسة (الذكاء الاصطناعي اللانهائي) =================
        let compRevealed = 0;

        function initCompetitionGame() { 
            updateCompScoreboard(); 
            backToCategories();
            showScreen('game-competition'); 
        }

        function updateCompScoreboard() {
            const sb = document.getElementById('c-scoreboard'); sb.innerHTML = '';
            teams.forEach((t, i) => {
                const btn = document.createElement('button'); btn.className = 'team-score';
                btn.innerHTML = `${t}: ${scores[i]} <br><small>(+ نقطة)</small>`;
                btn.onclick = () => { scores[i]++; updateCompScoreboard(); }; sb.appendChild(btn);
            });
        }

        function backToCategories() {
            document.getElementById('play-area').style.display = 'none';
            document.getElementById('comp-next-btn').style.display = 'none';
            document.getElementById('category-selection').style.display = 'block';
        }

        async function startAIQuestion(category) {
            document.getElementById('category-selection').style.display = 'none';
            document.getElementById('loading-indicator').style.display = 'block';
            
            // طلب السؤال من الذكاء الاصطناعي
            const questionData = await fetchQuestionFromAI(category);
            
            document.getElementById('loading-indicator').style.display = 'none';
            document.getElementById('play-area').style.display = 'block';
            
            renderCompetition(questionData);
        }

        async function fetchQuestionFromAI(category) {
            // سؤال احتياطي في حال عدم وجود API أو فشل الاتصال
            const fallbackQuestion = { 
                q: `اذكر 4 أشياء متعلقة بـ (${category}) (سؤال احتياطي لعدم توفر API)`, 
                a: [ { display: 'إجابة 1', aliases: ['1'] }, { display: 'إجابة 2', aliases: ['2'] }, { display: 'إجابة 3', aliases: ['3'] }, { display: 'إجابة 4', aliases: ['4'] } ],
                hint: 'قم بوضع API Key الخاص بك في الكود ليعمل الذكاء الاصطناعي'
            };

            async function fetchQuestionFromAI(category) {
    // سؤال احتياطي في حال فشل الـ API
    const fallback = {
        q: "ما هو الشيء الذي نضعه على المائدة ونقطعه ولا نأكله؟",
        a: [
            { display: "أوراق اللعب", aliases: ["بلوت", "ورق"] },
            { display: "البطيخ", aliases: ["حبحب"] },
            { display: "الخبز", aliases: ["تميس"] },
            { display: "اللحم", aliases: ["ذبيحة"] }
        ],
        hint: "شيء يستخدم للتسلية"
    };

    try {
        const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${API_KEY}`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                contents: [{ parts: [{ text: `أعطني سؤال مسابقات عن ${category} بـ 4 إجابات بتنسيق JSON فقط: {"q":"السؤال","a":[{"display":"إجابة","aliases":["مرادف"]}],"hint":"تلميح"}` }] }]
            })
        });

        const data = await response.json();
        
        // فحص وجود بيانات صحيحة
        if (data.candidates && data.candidates[0].content.parts[0].text) {
            let rawText = data.candidates[0].content.parts[0].text;
            const jsonMatch = rawText.match(/\{[\s\S]*\}/);
            if (jsonMatch) return JSON.parse(jsonMatch[0]);
        }
        return fallback; // العودة للسؤال الاحتياطي إذا كانت البيانات ناقصة
    } catch (e) {
        console.error("خطأ:", e);
        return fallback;
    }
}

            const promptText = `أنت صانع ألعاب مسابقات رمضانية عائلية ممتعة. أعطني سؤال واحد فقط في قسم "${category}".
            يجب أن يكون السؤال يحتمل 4 إجابات مختلفة صحيحة (مثل لعبة فاميلي فيود / Family Feud).
            يجب أن يكون الرد باللغة العربية، وبصيغة JSON صالحة (Valid JSON) فقط بدون أي نصوص أو شروحات إضافية، بهذا الشكل بالضبط:
            {
                "q": "نص السؤال هنا (مثال: اذكر 4 من غزوات الرسول)",
                "a": [
                    {"display": "الإجابة الأولى", "aliases": ["مرادف1", "مرادف2"]},
                    {"display": "الإجابة الثانية", "aliases": ["مرادف1"]},
                    {"display": "الإجابة الثالثة", "aliases": ["مرادف1"]},
                    {"display": "الإجابة الرابعة", "aliases": ["مرادف1"]}
                ],
                "hint": "تلميح عام للسؤال"
            }`;

            try {
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${API_KEY}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ contents: [{ parts: [{ text: promptText }] }] })
                });
                
                const data = await response.json();
                let rawText = data.candidates[0].content.parts[0].text;
                // تنظيف الكود من علامات الماركداون إذا أضافها الذكاء الاصطناعي
                rawText = rawText.replace(/```json/g, '').replace(/```/g, '').trim();
                return JSON.parse(rawText);

            } catch (error) {
                console.error("خطأ في جلب السؤال:", error);
                alert("حدث خطأ أثناء الاتصال بالذكاء الاصطناعي. تأكد من اتصالك بالإنترنت وصلاحية مفتاح الـ API.");
                return fallbackQuestion;
            }
        }

        function renderCompetition(data) {
            compRevealed = 0; 
            currentDataObj = data;
            document.getElementById('comp-question').innerText = currentDataObj.q;
            document.getElementById('comp-next-btn').style.display = 'none';
            const board = document.getElementById('comp-board'); board.innerHTML = '';
            
            currentDataObj.a.forEach((ansObj, i) => {
                const slot = document.createElement('div');
                slot.className = 'answer-slot'; slot.id = `ans-${i}`;
                slot.setAttribute('data-index', i + 1); slot.innerText = ansObj.display;
                board.appendChild(slot);
            });
        }

        function checkCompAnswer() {
            const guess = cleanText(document.getElementById('comp-guess').value);
            if(guess.length < 2) return;
            let found = false;
            
            currentDataObj.a.forEach((ansObj, i) => {
                const slot = document.getElementById(`ans-${i}`);
                const isMatch = ansObj.aliases.some(alias => cleanText(alias) === guess) || cleanText(ansObj.display) === guess;
                
                if (!slot.classList.contains('revealed') && isMatch) {
                    slot.classList.add('revealed'); playSound('correct');
                    compRevealed++; found = true;
                    if(compRevealed === currentDataObj.a.length) {
                        document.getElementById('comp-next-btn').style.display = 'block';
                        playSound('correct'); // صوت إضافي للانتهاء
                    }
                }
            });
            if(!found) playSound('wrong');
            document.getElementById('comp-guess').value = '';
        }

        // ================= إنهاء اللعبة =================
        function endGame() {
            const container = document.getElementById('final-results-container'); container.innerHTML = '';
            let maxScore = Math.max(...scores);
            teams.forEach((t, i) => {
                let isWinner = scores[i] === maxScore ? '👑' : '';
                container.innerHTML += `<h2 style="color:white">${isWinner} ${t} : <span style="color:var(--primary)">${scores[i]} نقاط</span></h2>`;
            });
            showScreen('results-screen');
        }
    </script>
</body>
</html>
